[project]
name = "handil"
version = "0.1.0"
description = "Imitation learning from hand-control teleoperation logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "mujoco>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# CUDA wheels. The default PyPI torch here resolves to a cu130 build, which
# needs an NVIDIA driver >= 580; this machine runs 570.195 (CUDA 12.8), so that
# build reports cuda.is_available() == False and training silently falls back to
# CPU. cu128 is the right target: it works with a 12.8 driver AND supports the
# RTX 5090's Blackwell architecture (sm_120), which older CUDA builds do not.
#   uv sync --extra dev --extra cuda
cuda = ["torch>=2.8"]
# Plotting / table generation for the comparison report.
analysis = ["matplotlib>=3.8", "pandas>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handil"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: needs the hand-control logs on disk"]
